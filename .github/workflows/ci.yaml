name: Build Jetson Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'  # Triggers on tags like v1.0, v2.3.4 etc.

env:
  SOURCE_DATE_EPOCH: 0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          echo "Disk space after cleanup:"
          df -h

      - name: Configure Docker to use /mnt
        run: |
          sudo mkdir -p /mnt/docker
          echo '{"data-root": "/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker

      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set Up Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman just jq qemu-user-static

      - name: Build Root Filesystem
        run: just build-jetson-rootfs 24.04

      - name: Build Jetson Image
        run: just build-jetson-image -b jetson-orin-nano -d SD -l 36

      - name: Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetson-image
          path: jetson.img

      - name: Compress Image
        run: |
          sudo apt-get install -y xz-utils
          xz -9e --threads=0 jetson.img

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          files: jetson.img.xz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}